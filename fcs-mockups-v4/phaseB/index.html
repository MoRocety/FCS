      radial-gradient(circle at 100% 0%, rgba(139,92,246,0.28) 0%, transparent 45%),

  }
  @keyframes aurora { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.1) rotate(2deg); } }

  body::after {

    background: linear-gradient(90deg, #1e293b, #2563eb, #4f46e5, #1e293b);

    animation: textShine 6s linear infinite;
  }
  .dark main h2 { background: linear-gradient(90deg, #f8fafc, #60a5fa, #a78bfa, #f8fafc); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,0.35); } 50% { box-shadow: 0 0 0 10px rgba(37,99,235,0); } }

  button.bg-blue-600 { position: relative; overflow: hidden; transition: transform 0.15s; }
  button.bg-blue-600:active { transform: scale(0.96); }
  button.bg-blue-600::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg); transition: left 0.6s;
  }
  button.bg-blue-600:hover::after { left: 160%; }

  /* table rows shimmer on hover */
  tbody tr { transition: background 0.15s, transform 0.15s; }
  tbody tr:hover { transform: scale(1.005); }

  /* focus rings */
  input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }

function toast(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'fixed bottom-4 right-4 z-[100] flex flex-col gap-2';
    document.body.appendChild(container);
  }
  const colors = {info: 'bg-slate-800 text-white', success: 'bg-emerald-600 text-white', warning: 'bg-amber-500 text-white', error: 'bg-rose-600 text-white'};
  const el = document.createElement('div');
  el.className = `${colors[type]} px-4 py-3 rounded-xl shadow-lg text-sm font-medium transform transition-all duration-300 translate-y-4 opacity-0`;
  el.innerHTML = `<div class="flex items-center gap-2">${message}</div>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.remove('translate-y-4', 'opacity-0'));
  setTimeout(() => { el.classList.add('translate-y-4', 'opacity-0'); setTimeout(() => el.remove(), 300); }, 3000);
}

function barChart(data, labels, opts = {}) {
  const width = opts.width || 300;
  const height = opts.height || 120;
  const max = Math.max(...data, 1);
  const barW = (width / data.length) * 0.6;
  const gap = (width / data.length) * 0.4;
  const colors = opts.colors || Array(data.length).fill('#2563eb');
  const bars = data.map((d, i) => {
    const h = (d / max) * (height - 24);
    const x = i * (barW + gap) + gap / 2;
    const y = height - h - 20;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${colors[i]}" opacity="0.9"/><text x="${x + barW / 2}" y="${height - 4}" text-anchor="middle" font-size="10" fill="currentColor" class="text-slate-500">${labels[i]}</text>`;
  }).join('');
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${bars}</svg>`;
}

function gauge(value, label, opts = {}) {
  const r = opts.r || 40;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  const color = value >= 75 ? '#10b981' : value >= 50 ? '#f59e0b' : '#ef4444';
  return `
    <div class="relative inline-flex flex-col items-center justify-center">
      <svg width="${r * 2 + 16}" height="${r * 2 + 16}" viewBox="0 0 ${r * 2 + 16} ${r * 2 + 16}">
        <circle cx="${r + 8}" cy="${r + 8}" r="${r}" stroke="currentColor" stroke-width="8" fill="none" class="text-slate-200 dark:text-slate-700"/>
        <circle cx="${r + 8}" cy="${r + 8}" r="${r}" stroke="${color}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${r + 8} ${r + 8})"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-xl font-bold">${value}</span>
        <span class="text-[10px] uppercase tracking-wide text-slate-500">${label}</span>
      </div>
    </div>`;
}

function formatTime(h) {
  const hour = Math.floor(h);
  const min = Math.round((h - hour) * 60);
  const ampm = hour < 12 ? 'AM' : 'PM';
  const disp = hour % 12 || 12;
  return `${disp}:${min.toString().padStart(2, '0')} ${ampm}`;
}

function parseDays(str) { return str.replace('Th', 'R').split(''); }
function dayName(d) { return {M: 'Mon', T: 'Tue', W: 'Wed', R: 'Thu', F: 'Fri'}[d]; }
function dayNameShort(d) { return d === 'R' ? 'Th' : d; }

function courseById(id) { return DATA.courses.find(c => c.id === id); }
function instructorById(id) { return DATA.instructors.find(i => i.id === id); }
function sectionById(id) {
  for (const c of DATA.courses) {
    const s = c.sections.find(x => x.id === id);
    if (s) return {...s, courseId: c.id, courseCode: c.code, credits: c.credits};
  }
  return null;
}
function instructorName(id) { const i = instructorById(id); return i ? i.name.split(' ').pop() : id; }
function courseCode(id) { const c = courseById(id); return c ? c.code : id; }
function sectionCode(secId) { const s = sectionById(secId); return s ? `${s.courseCode} ${secId.split('-').pop()}` : secId; }

function hasConflict(sections) {
  const slots = [];
  sections.forEach(s => parseDays(s.days).forEach(d => slots.push({d, start: s.start, end: s.start + s.duration})));
  for (let i = 0; i < slots.length; i++) {
    for (let j = i + 1; j < slots.length; j++) {
      if (slots[i].d === slots[j].d && slots[i].start < slots[j].end && slots[j].start < slots[i].end) return true;
    }
  }
  return false;
}

function computeMetrics(sections) {
  const credits = sections.reduce((a, s) => a + (sectionById(s.id)?.credits || 0), 0);
  const starts = sections.map(s => s.start);
  const avgStart = starts.length ? formatTime(starts.reduce((a, b) => a + b, 0) / starts.length) : '—';
  const spread = starts.length ? Math.max(...starts) - Math.min(...starts) : 0;
  const compactness = Math.max(0, Math.min(100, Math.round(100 - spread * 8)));
  const rating = sections.length ? (sections.reduce((a, s) => a + s.rating, 0) / sections.length).toFixed(1) : '—';
  const score = Math.round((compactness + (parseFloat(rating) * 20) + Math.min(100, credits / 18 * 100)) / 3);
  return {credits, avgStart, compactness, rating, score};
}

function cartesian(arrays) {
  if (!arrays.length) return [[]];
  return arrays.reduce((acc, arr) => acc.flatMap(a => arr.map(b => [...a, b])), [[]]);
}

function generateSchedules() {
  const selected = DATA.courses.filter(c => app.selectedIds.includes(c.id));
  const excluded = new Set(app.builder.excludedDays);
  const pool = selected.map(c => {
    let secs = c.sections.filter(s => !parseDays(s.days).some(d => excluded.has(d)));
    if (!secs.length) secs = c.sections;
    return secs.map(s => ({...s, courseId: c.id, credits: c.credits}));
  });
  let combos = cartesian(pool).filter(sections => !hasConflict(sections)).slice(0, 12);
  app.builder.generated = combos.map((sections, i) => {
    const metrics = computeMetrics(sections);
    const score = Math.max(0, Math.min(100, metrics.score - i * 2));
    return {sections, metrics, score};
  }).sort((a, b) => b.score - a.score);
  app.builder.currentIdx = 0;
  toast('Generated ' + app.builder.generated.length + ' schedules', 'success');
  render();
}

function renderTimetable(sections, opts = {}) {
  const days = ['M', 'T', 'W', 'R', 'F'];
  const startHour = 8, endHour = 18;
  const rows = (endHour - startHour) * 2;
  const header = `<div class="grid grid-cols-6 gap-px mb-1" style="grid-column:1/-1"><div class="text-xs text-slate-400 text-center py-1">Time</div>${days.map(d => `<div class="text-xs font-semibold text-center py-1">${dayName(d)}</div>`).join('')}</div>`;
  let grid = '';
  for (let h = startHour; h < endHour; h += 0.5) {
    const row = Math.round((h - startHour) * 2) + 2;
    grid += `<div class="grid grid-cols-6 gap-px" style="grid-row:${row};grid-column:1/-1"><div class="text-[10px] text-slate-400 text-right pr-2 py-1 border-t border-slate-100 dark:border-slate-800">${formatTime(h)}</div>${days.map(() => `<div class="border-t border-slate-100 dark:border-slate-800"></div>`).join('')}</div>`;
  }
  const palette = ['bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500', 'bg-violet-500', 'bg-cyan-500', 'bg-fuchsia-500', 'bg-lime-500'];
  const colorMap = {};
  DATA.courses.forEach((c, idx) => colorMap[c.id] = palette[idx % palette.length]);
  const blocks = sections.map(s => {
    const sec = sectionById(s.id) || s;
    const course = courseById(sec.courseId) || {};
    return parseDays(sec.days).map(d => {
      const col = days.indexOf(d) + 2;
      const startRow = Math.round((sec.start - startHour) * 2) + 2;
      const endRow = startRow + Math.round(sec.duration * 2);
      return `<div class="rounded-lg p-1.5 text-[10px] text-white shadow-md overflow-hidden ${colorMap[sec.courseId] || 'bg-slate-500'}" style="grid-column:${col};grid-row:${startRow}/${endRow}">
        <div class="font-bold truncate">${course.code || ''}</div>
        <div class="truncate opacity-90">${formatTime(sec.start)}-${formatTime(sec.start + sec.duration)}</div>
        <div class="truncate opacity-80">${sec.location || ''}</div>
      </div>`;
    }).join('');
  }).join('');
  return `<div class="relative rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden bg-white dark:bg-slate-800" style="height:${opts.height || '320px'}">
    <div class="absolute inset-0 p-2 grid" style="grid-template-rows:auto repeat(${rows}, 1fr);grid-template-columns:3.5rem repeat(5,1fr);gap:2px">${header}${grid}${blocks}</div>
  </div>`;
}

function confetti() {

    el.style.width = '8px'; el.style.height = '8px'; el.style.borderRadius = '50%';

    el.style.zIndex = 9999; el.style.pointerEvents = 'none';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 120;
    el.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';

}

function renderCompare(state) {
  const [id1, id2] = state.compare;
  const a = DATA.instructors.find(i => i.id === id1), b = DATA.instructors.find(i => i.id === id2);
  function pred(inst) {
    const base = 3.0;
    const gpa = Math.min(4.0, Math.max(2.0, base + (inst.quality - 3) * 0.25 - (inst.difficulty - 3) * 0.15)).toFixed(2);
    const letter = gpa >= 3.7 ? 'A-' : gpa >= 3.3 ? 'B+' : gpa >= 3.0 ? 'B' : gpa >= 2.7 ? 'B-' : 'C+';
    return {gpa, letter};
  }
  const pa = pred(a), pb = pred(b);
  return `
    <div class="space-y-6 animate-fadeIn">
      <h2 class="text-2xl font-bold tracking-tight">Instructor Comparison</h2>
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 flex flex-col md:flex-row gap-4">
        <select onchange="app.compare[0]=this.value; render();" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent">${DATA.instructors.map(i => `<option value="${i.id}" ${i.id===id1?'selected':''}>${i.name}</option>`).join('')}</select>
        <select onchange="app.compare[1]=this.value; render();" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent">${DATA.instructors.map(i => `<option value="${i.id}" ${i.id===id2?'selected':''}>${i.name}</option>`).join('')}</select>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        ${[a,b].map((inst, idx) => `<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 ${idx===0?'border-l-4 border-l-blue-500':'border-l-4 border-l-indigo-500'}">
          <h3 class="text-xl font-bold">${inst.name}</h3>
          <p class="text-sm text-slate-500 mb-4">${inst.dept}</p>
          <div class="space-y-3">
            <div class="flex justify-between text-sm"><span>Effectiveness</span><span class="font-semibold">${inst.effectiveness}</span></div>
            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2"><div class="bg-blue-500 h-2 rounded-full" style="width:${inst.effectiveness}%"></div></div>
            <div class="flex justify-between text-sm"><span>Quality</span><span class="font-semibold">${inst.quality}</span></div>
            <div class="flex justify-between text-sm"><span>Difficulty</span><span class="font-semibold">${inst.difficulty}</span></div>
            <div class="flex justify-between text-sm"><span>Pass Rate</span><span class="font-semibold">${inst.passRate}%</span></div>
          </div>
          <div class="mt-5 p-4 rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-900/20 dark:to-indigo-900/20 text-center">
            <div class="text-xs text-slate-500 uppercase">Predicted GPA</div>
            <div class="text-3xl font-bold text-slate-900 dark:text-white">${idx===0?pa.letter:pb.letter}</div>
            <div class="text-sm text-slate-500">${idx===0?pa.gpa:pb.gpa} average</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
}

function renderWillItFill(state) {
  const sections = DATA.courses.flatMap(c => c.sections.map(s => ({...s, courseCode: c.code, courseTitle: c.title})));
  const activeId = state.activeSection || sections[0].id;
  const sec = sections.find(s => s.id === activeId);
  const velocity = [Math.max(0, sec.seats - 5), Math.max(0, sec.seats - 2), sec.seats, Math.min(sec.capacity, sec.seats + 4), Math.min(sec.capacity, sec.seats + 7)];
  const fillChance = Math.round((sec.seats / sec.capacity) * 100);
  const trend = velocity[velocity.length - 1] > velocity[0] ? 'up' : 'down';
  return `
    <div class="space-y-6 animate-fadeIn">
      <h2 class="text-2xl font-bold tracking-tight">Will It Fill?</h2>
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5">
        <label class="text-sm font-medium">Select a section</label>
        <select onchange="app.activeSection=this.value; render();" class="mt-2 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent">
          ${sections.map(s => `<option value="${s.id}" ${s.id===activeId?'selected':''}>${s.courseCode} ${s.id.split('-').pop()} · ${formatTime(s.start)} ${s.days}</option>`).join('')}
        </select>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="md:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5">
          <h3 class="font-semibold mb-3">Seat Velocity (last 5 checks)</h3>
          ${barChart(velocity, ['-48h','-24h','Now','+24h','+48h'], {colors: velocity.map(v => v >= sec.capacity ? '#ef4444' : '#2563eb')})}
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 flex flex-col items-center justify-center text-center">
          ${gauge(fillChance, 'Fill Chance', {r:44})}
          <div class="mt-3 text-sm text-slate-500">Trend: <span class="font-semibold ${trend==='up'?'text-rose-600':'text-emerald-600'}">${trend==='up'?'Rising ↗':'Steady ↘'}</span></div>
          <div class="mt-2 text-xs text-slate-400">Confidence interval: ±${Math.round(100 - fillChance / 2)}%</div>
        </div>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5">
        <h3 class="font-semibold mb-3">Historical Fill Data</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 text-center"><div class="font-bold">72h</div><div class="text-xs text-slate-500">avg fill time</div></div>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 text-center"><div class="font-bold">${sec.capacity}</div><div class="text-xs text-slate-500">capacity</div></div>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 text-center"><div class="font-bold">${sec.seats}</div><div class="text-xs text-slate-500">open seats</div></div>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 text-center"><div class="font-bold">${Math.max(0, sec.capacity - sec.seats)}</div><div class="text-xs text-slate-500">filled</div></div>
        </div>
      </div>
    </div>`;
}

function renderHealth(state) {
  const schedule = state.builder.generated[state.builder.currentIdx];
  const components = schedule ? [
    {name:'No time conflicts', score: 100, weight: 25},
    {name:'Compact commute', score: schedule.metrics.compactness, weight: 15},
    {name:'Workload balance', score: Math.max(0, Math.round(100 - schedule.sections.length * 8)), weight: 20},
    {name:'Instructor quality', score: Math.round(schedule.sections.reduce((a, s) => a + s.rating, 0) / schedule.sections.length * 20), weight: 20},
    {name:'Seat urgency', score: Math.round(schedule.sections.reduce((a, s) => a + (s.seats / s.capacity * 100), 0) / schedule.sections.length), weight: 20},
  ] : [];
  const total = components.length ? Math.round(components.reduce((a, c) => a + c.score * (c.weight / 100), 0)) : 0;
  return `
    <div class="space-y-6 animate-fadeIn">
      <h2 class="text-2xl font-bold tracking-tight">Schedule Health Score</h2>
      ${schedule ? `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div class="md:col-span-1 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 flex flex-col items-center justify-center">
            ${gauge(total, 'Health', {r:56})}
            <div class="mt-3 text-sm font-medium ${total>=80?'text-emerald-600':total>=60?'text-amber-600':'text-rose-600'}">${total>=80?'Excellent':total>=60?'Good':'Needs work'}</div>
          </div>
          <div class="md:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5">
            <h3 class="font-semibold mb-4">Score Breakdown</h3>
            <div class="space-y-4">${components.map(c => `<div><div class="flex justify-between text-sm mb-1"><span>${c.name}</span><span class="font-semibold">${c.score}/100</span></div><div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2.5"><div class="h-2.5 rounded-full ${c.score>=80?'bg-emerald-500':c.score>=60?'bg-amber-500':'bg-rose-500'}" style="width:${c.score}%"></div></div><div class="text-xs text-slate-400 mt-1">Weight ${c.weight}%</div></div>`).join('')}</div>
          </div>
        </div>
      ` : `<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-10 text-center text-slate-500">Generate a schedule in the Builder to see health analysis.</div>`}
    </div>`;
}

function renderStress(state) {
  const schedule = state.builder.generated[state.builder.currentIdx];
  const flags = [];
  if (schedule) {
    const days = new Set(schedule.sections.flatMap(s => parseDays(s.days)));
    if (days.size === 5) flags.push({level:'warn', title:'No free weekday', desc:'Back-to-back classes every day can lead to burnout.'});
    if (schedule.sections.some(s => s.start < 8.5)) flags.push({level:'warn', title:'Early mornings', desc:'Classes before 8:30 AM hurt sleep consistency.'});
    const totalHours = schedule.sections.reduce((a, s) => a + s.duration * parseDays(s.days).length, 0);
    if (totalHours > 20) flags.push({level:'bad', title:'Heavy load', desc:`${Math.round(totalHours)} hours of class per week plus study time.`});
    if (schedule.sections.length > 5) flags.push({level:'warn', title:'Context switching', desc:'Many distinct courses fragment focus.'});
    if (!flags.length) flags.push({level:'good', title:'Low stress', desc:'Schedule has breathing room and balanced timing.'});
  }
  return `
    <div class="space-y-6 animate-fadeIn">
      <h2 class="text-2xl font-bold tracking-tight">Schedule Stress Test</h2>
      ${schedule ? `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          ${flags.map(f => `<div class="flex gap-4 p-5 rounded-2xl border ${f.level==='good'?'border-emerald-200 bg-emerald-50/50 dark:bg-emerald-900/10':f.level==='warn'?'border-amber-200 bg-amber-50/50 dark:bg-amber-900/10':'border-rose-200 bg-rose-50/50 dark:bg-rose-900/10'}">
            <div class="mt-1">${icon(f.level==='good'?'check':f.level==='warn'?'information':'fire','w-6 h-6')}</div>
            <div><h3 class="font-semibold ${f.level==='good'?'text-emerald-700 dark:text-emerald-300':f.level==='warn'?'text-amber-700 dark:text-amber-300':'text-rose-700 dark:text-rose-300'}">${f.title}</h3><p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${f.desc}</p></div>
          </div>`).join('')}
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5">
          <h3 class="font-semibold mb-4">Weekly Energy Forecast</h3>
          <div class="flex items-end gap-2 h-40">${['M','T','W','R','F'].map(d => {
             const hours = schedule.sections.filter(s => parseDays(s.days).includes(d)).reduce((a, s) => a + s.duration, 0);
             return `<div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-t-xl ${hours>5?'bg-rose-400':hours>3?'bg-amber-400':'bg-emerald-400'} transition-all" style="height:${Math.min(100, hours * 16)}%"></div><span class="text-xs text-slate-500">${d}</span><span class="text-xs font-semibold">${Math.round(hours)}h</span></div>`;
          }).join('')}</div>
        </div>
      ` : `<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-10 text-center text-slate-500">Generate a schedule first.</div>`}
    </div>`;
}


const VIEWS = {
    catalog: {label:'Catalog', icon:'academic', render: renderCatalog},
    builder: {label:'Builder', icon:'calendar', render: renderBuilder},
    saved: {label:'Saved', icon:'bookmark', render: renderSaved},
    instructor: {label:'Instructor', icon:'user', render: renderInstructor},
    compare: {label:'Compare', icon:'chart', render: renderCompare},
    course: {label:'Course', icon:'beaker', render: renderCourse},
    willitfill: {label:'Will It Fill', icon:'bolt', render: renderWillItFill},
    health: {label:'Health', icon:'shield', render: renderHealth},
    stress: {label:'Stress', icon:'fire', render: renderStress}
};

const DEFAULT_SAVED = [
  {
    id: 1,
    name: 'Balanced Fall',
    savedAt: 'Jun 14, 2026',
    sections: [
      {id:'cs101-02', instructor:'dr_ali', days:'TTh', start:10.0, duration:1.5, seats:45, capacity:60, rating:4.2, location:'SCI Lab 3', courseId:'cs101', credits:4},
      {id:'math201-01', instructor:'prof_chen', days:'MWF', start:9.0, duration:1.333, seats:30, capacity:80, rating:4.6, location:'MATH Bldg 201', courseId:'math201', credits:4},
      {id:'eng102-02', instructor:'prof_kim', days:'TTh', start:13.5, duration:1.5, seats:34, capacity:40, rating:4.5, location:'LIT Hall 11', courseId:'eng102', credits:3}
    ]
  }
];

var app = {
  view: 'catalog',
  darkMode: false,
  selectedIds: [],
  catalog: {search:'', dept:'All', minCredits:0, maxCredits:6, page:1},
  builder: {minCredits:12, maxCredits:18, excludedDays:[], generated:[], currentIdx:0},
  saved: JSON.parse(localStorage.getItem('fcs_saved') || JSON.stringify(DEFAULT_SAVED)),
  activeInstructor: null,
  compare: ['dr_smith','dr_ali'],
  activeCourse: null,
  activeSection: null,
  feedVotes: {},
  reviews: [],
  monitor: ['cs101-01','math201-02'],
  protected: [],
  history: [],
  planner: {1:[],2:[],3:[],4:[],5:[],6:[],7:[],8:[]},
  substitutionQuery: 'humanities elective',
  reviewStars: 0,
  chat: {open:false, messages:[{role:'agent', text:'Hi! I am your FCS assistant. Ask me to find courses, build schedules, or check degree progress.'}], audit:[]},
  memory: {major:'Computer Science', year:'Junior', goal:'graduate on time', standing:'Good', preferences:['No 8 AMs','Project-based']},
  career: 'industry'
};
if (typeof globalThis !== 'undefined') globalThis.app = app;

function setView(v) { app.view = v; render(); }
function toggleDark() { app.darkMode = !app.darkMode; document.documentElement.classList.toggle('dark', app.darkMode); document.getElementById('darkBtn').innerHTML = icon(app.darkMode ? 'sun' : 'moon'); render(); }

function toggleCourse(id) {
  const idx = app.selectedIds.indexOf(id);
  if (idx > -1) app.selectedIds.splice(idx, 1);
  else app.selectedIds.push(id);
  render();
}
function toggleDay(d) {
  const idx = app.builder.excludedDays.indexOf(d);
  if (idx > -1) app.builder.excludedDays.splice(idx, 1);
  else app.builder.excludedDays.push(d);
  render();
}
function prevCombo() { if (app.builder.currentIdx > 0) { app.builder.currentIdx--; render(); } }
function nextCombo() { if (app.builder.currentIdx < app.builder.generated.length - 1) { app.builder.currentIdx++; render(); } }
function saveCurrentSchedule() {
  const s = app.builder.generated[app.builder.currentIdx];
  if (!s) { toast('Nothing to save','warning'); return; }
  app.saved.unshift({id: Date.now(), name: 'Schedule ' + (app.saved.length + 1), sections: s.sections, savedAt: new Date().toLocaleString()});
  localStorage.setItem('fcs_saved', JSON.stringify(app.saved));
  toast('Schedule saved','success');
  confetti();
  render();
}
function loadSaved(i) {
  const s = app.saved[i];
  app.builder.generated = [{sections: s.sections, metrics: computeMetrics(s.sections), score: computeMetrics(s.sections).score}];
  app.builder.currentIdx = 0;
  setView('builder');
}
function deleteSaved(i) { app.saved.splice(i,1); localStorage.setItem('fcs_saved', JSON.stringify(app.saved)); render(); }
function voteFeed(id, dir) { if (app.feedVotes[id] === dir) delete app.feedVotes[id]; else app.feedVotes[id] = dir; render(); }
function submitReview() {
  const inst = document.getElementById('revInst').value;
  const course = document.getElementById('revCourse').value;
  const grade = document.getElementById('revGrade').value;
  const text = document.getElementById('revText').value;
  const rating = app.reviewStars || 4;
  app.reviews.unshift({inst, course, grade, text, rating, anon: document.getElementById('revAnon').checked, author: 'You'});
  toast('Review submitted','success');
  render();
}
function addMonitor(id) { if (!app.monitor.includes(id)) { app.monitor.push(id); render(); } }
function removeMonitor(id) { app.monitor = app.monitor.filter(x=>x!==id); render(); }
function toggleProtected(d, h) {
  const idx = app.protected.findIndex(p => p.day===d && Math.abs(p.start-h)<0.25);
  if (idx > -1) app.protected.splice(idx,1); else app.protected.push({day:d, start:h, duration:0.5});
  render();
}
function addHistory(id, grade) { app.history.unshift({courseId:id, grade}); render(); }
function dropPlanner(sem, ev) {
  const [id, src] = ev.dataTransfer.getData('text').split('|');
  if (src !== 'pool') app.planner[src] = app.planner[src].filter(x=>x!==id);
  if (sem !== 'pool' && !app.planner[sem].includes(id)) app.planner[sem].push(id);
  render();
}
function gpaPoints(g) {
  const map = {'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'D':1.0,'F':0.0};
  return map[g] || 0;
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = VIEWS[app.view].render(app);
  document.querySelectorAll('#main-nav button').forEach(b => {
    const active = b.id === 'nav-' + app.view;
    b.className = active
      ? 'flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition bg-blue-600 text-white shadow-md'
      : 'flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800';
  });
  renderHints();
}

render();
setInterval(() => { hintIndex++; renderHints(); }, 8000);

// respect URL params / hash for demo links
(() => {
  const raw = location.search || location.hash.replace(/^#/, '?');
  const params = new URLSearchParams(raw);
  if (params.get('dark') === '1' && !app.darkMode) toggleDark();
  const v = params.get('view');
  if (v && VIEWS[v]) { app.view = v; }
  const courses = params.get('courses');
  if (courses) { courses.split(',').forEach(id => { if (!app.selectedIds.includes(id.trim())) app.selectedIds.push(id.trim()); }); }
  render();
  if (params.get('generate') === '1' && app.view === 'builder') generateSchedules();
})();
</script>
